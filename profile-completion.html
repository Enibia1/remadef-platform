<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0B1F3A">


<title>
REMADEF | Complete Profile
</title>


<link rel="stylesheet" href="css/profile-completion.css">


</head>


<body>


<!-- HEADER -->

<header class="profile-header">


<div class="logo">

<h1>
REMADEF
</h1>

<span>
Complete Profile
</span>

</div>


<nav>

<a href="home.html">
Home
</a>


<a href="profile.html">
Profile
</a>


</nav>


</header>





<!-- MAIN -->

<main class="profile-container">



<section class="completion-card">


<h2>
Build Your REMADEF Identity
</h2>


<p>
Complete your profile to access opportunities.
</p>



<div class="progress-wrapper">


<div class="progress-bar">

<div 
id="profileProgress"
class="progress-fill">
</div>

</div>


<span id="progressText">
0%
</span>


</div>


</section>





<form id="profileForm">





<!-- BASIC INFORMATION -->


<section class="profile-section">


<h3>
Basic Information
</h3>



<div class="form-group">

<label>
First Name
</label>

<input
type="text"
id="first_name"
name="first_name"
required
>

</div>




<div class="form-group">

<label>
Last Name
</label>

<input
type="text"
id="last_name"
name="last_name"
required
>

</div>




<div class="form-group">

<label>
Display Name
</label>


<input
type="text"
id="display_name"
name="display_name"
placeholder="Public name"
>

</div>




<div class="form-group">

<label>
Date of Birth
</label>


<input
type="date"
id="date_of_birth"
name="date_of_birth"
>

</div>




<div class="form-group">

<label>
Gender
</label>


<select
id="gender"
name="gender"
>


<option value="">
Select gender
</option>


<option value="male">
Male
</option>


<option value="female">
Female
</option>


<option value="prefer_not_to_say">
Prefer not to say
</option>


</select>


</div>


</section>







<!-- CONTACT LOCATION -->


<section class="profile-section">


<h3>
Contact & Location
</h3>




<div class="form-group">

<label>
Email
</label>


<input
type="email"
id="email"
name="email"
readonly
>

</div>





<div class="form-group">

<label>
Phone
</label>


<input
type="tel"
id="phone"
name="phone"
>

</div>





<div class="form-group">

<label>
Country
</label>


<input
type="text"
id="country"
name="country"
>

</div>





<div class="form-group">

<label>
State
</label>


<input
type="text"
id="state"
name="state"
>

</div>





<div class="form-group">

<label>
City
</label>


<input
type="text"
id="city"
name="city"
>

</div>



</section>








<!-- OPPORTUNITY PROFILE -->


<section class="profile-section">


<h3>
Opportunity Profile
</h3>




<div class="form-group">

<label>
Professional Headline
</label>


<input
type="text"
id="headline"
name="headline"
placeholder="Example: Software Developer"
>

</div>





<div class="form-group">


<label>
About
</label>


<textarea
id="about"
name="about"
rows="5"
placeholder="Tell people about yourself"
></textarea>


</div>





<div class="form-group">


<label>
Skills
</label>


<input
type="text"
id="skills"
name="skills"
placeholder="Example: Python, Marketing, Design"
>


</div>




</section>








<!-- EDUCATION -->


<section class="profile-section">


<h3>
Education
</h3>




<div class="form-group">


<label>
Education Level
</label>


<select
id="education_level"
name="education_level"
>


<option value="">
Select level
</option>


<option value="secondary">
Secondary School
</option>


<option value="ond">
OND
</option>


<option value="hnd">
HND
</option>


<option value="bsc">
BSc
</option>


<option value="msc">
MSc
</option>


<option value="phd">
PhD
</option>


</select>


</div>





<div class="form-group">


<label>
Institution
</label>


<input
type="text"
id="institution"
name="institution"
>


</div>



</section>








<!-- SAVE -->


<section class="save-section">


<button
type="submit"
id="saveProfile"
>

Save Profile

</button>


</section>




</form>



</main>








<!-- LOADING -->


<div 
id="loadingOverlay"
class="loading-overlay hidden"
>


<div>

<p>
Saving profile...
</p>


</div>


</div>







<!-- APPWRITE SDK -->


<script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>



<!-- REMADEF PROFILE JS -->


<script src="js/profile-completion.js"></script>



</body>


</html>
