<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <meta 
        name="theme-color" 
        content="#0B1F3A"
    >

    <title>
        Complete Profile | REMADEF
    </title>


    <!-- REMADEF CSS -->
    <link 
        rel="stylesheet" 
        href="css/profile-completion.css"
    >


</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="profile-header">


    <div class="logo-container">

        <h1>
            REMADEF
        </h1>

        <span>
            Profile Completion
        </span>

    </div>


    <nav>

        <a href="home.html">
            Home
        </a>


        <a href="profile.html">
            Profile
        </a>


    </nav>


</header>



<!-- ================================
     MAIN CONTAINER
================================ -->


<main class="profile-container">



    <!-- PROFILE COMPLETION CARD -->

    <section class="completion-card">


        <h2>
            Complete Your Profile
        </h2>


        <p>
            Build your verified REMADEF identity.
        </p>



        <div class="progress-wrapper">


            <div class="progress-bar">


                <div 
                    id="profileProgress"
                    class="progress-fill"
                >
                </div>


            </div>


            <span id="progressText">

                0%

            </span>


        </div>



    </section>





    <!-- ================================
         PROFILE FORM
    ================================= -->


    <form 
        id="profileForm"
        class="profile-form"
    >



        <!-- BASIC INFORMATION -->

        <section 
            id="basicInformation"
            class="profile-section"
        >

            <h3>
                Basic Information
            </h3>


            <!-- Part 1B will be inserted here -->


        </section>





        <!-- CONTACT LOCATION -->


        <section 
            id="contactLocation"
            class="profile-section"
        >

            <h3>
                Contact & Location
            </h3>


            <!-- Part 1C will be inserted here -->


        </section>





        <!-- OPPORTUNITY PROFILE -->


        <section 
            id="opportunityProfile"
            class="profile-section"
        >

            <h3>
                Opportunity Profile
            </h3>


            <!-- Part 1D will be inserted here -->


        </section>





        <!-- EDUCATION MEDIA -->


        <section 
            id="educationMedia"
            class="profile-section"
        >

            <h3>
                Education & Media
            </h3>


            <!-- Part 1E will be inserted here -->


        </section>





        <!-- SAVE AREA -->


        <section 
            class="save-section"
        >


            <button
                type="submit"
                id="saveProfile"
            >

                Save Profile

            </button>


        </section>



    </form>




</main>





<!-- ================================
     LOADING OVERLAY
================================ -->


<div 
    id="loadingOverlay"
    class="loading-overlay hidden"
>


    <div class="loader">


        <p>
            Saving profile...
        </p>


    </div>


</div>






<!-- ================================
     APPWRITE SDK
================================ -->


<script 
src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0">
</script>




<!-- REMADEF JS -->

<script 
src="js/profile-completion.js">
</script>



</body>


</html>
