<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#0B1F3A"
    >

    <meta
        name="description"
        content="Sign in to your REMADEF account."
    >

    <title>REMADEF — Sign In</title>

    <style>

        :root {
            --navy: #0B1F3A;
            --navy-light: #16385F;

            --white: #FFFFFF;
            --surface: #F5F7FA;
            --border: #DCE3EB;

            --text: #172033;
            --muted: #667085;

            --green: #198754;
            --red: #B42318;
            --gold: #B8892D;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    180deg,
                    var(--surface),
                    var(--white)
                );

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing: antialiased;

        }

        .app {

            width: 100%;

            max-width: 430px;

        }

        .brand {

            text-align: center;

            margin-bottom: 20px;

        }

        .brand-name {

            color: var(--navy);

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -0.8px;

        }

        .brand-line {

            width: 42px;

            height: 3px;

            margin: 8px auto 0;

            border-radius: 999px;

            background: var(--gold);

        }

        .brand-description {

            max-width: 300px;

            margin: 12px auto 0;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.5;

        }

        .card {

            padding: 26px 22px;

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(11, 31, 58, .08);

        }

        h1 {

            margin: 0;

            color: var(--navy);

            font-size: 22px;

        }

        .subtitle {

            margin: 7px 0 20px;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

        }

        .message {

            display: none;

            margin-bottom: 16px;

            padding: 12px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.45;

            white-space: pre-line;

        }

        .error {

            color: var(--red);

            background: #FFF1F0;

            border: 1px solid #F5C2C0;

        }

        .success {

            color: var(--green);

            background: #ECFDF3;

            border: 1px solid #B7E4C7;

        }

        .tabs {

            display: flex;

            gap: 4px;

            padding: 4px;

            margin-bottom: 18px;

            background: var(--surface);

            border-radius: 11px;

        }

        .tab {

            flex: 1;

            min-height: 40px;

            border: 0;

            border-radius: 8px;

            background: transparent;

            color: var(--muted);

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

        }

        .tab.active {

            background: var(--white);

            color: var(--navy);

            box-shadow:
                0 1px 4px rgba(11, 31, 58, .12);

        }

        .field {

            margin-bottom: 16px;

        }

        label {

            display: block;

            margin-bottom: 6px;

            color: var(--text);

            font-size: 13px;

            font-weight: 700;

        }

        input {

            width: 100%;

            min-height: 46px;

            padding: 12px 13px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--white);

            color: var(--text);

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: var(--navy);

            box-shadow:
                0 0 0 3px rgba(11, 31, 58, .10);

        }

        .password-wrapper {

            position: relative;

        }

        .password-wrapper input {

            padding-right: 48px;

        }

        .toggle-password {

            position: absolute;

            top: 50%;

            right: 10px;

            transform: translateY(-50%);

            width: 34px;

            height: 34px;

            border: 0;

            background: transparent;

            font-size: 17px;

            cursor: pointer;

        }

        .forgot {

            display: block;

            margin-top: -5px;

            margin-bottom: 18px;

            color: var(--navy);

            font-size: 12px;

            font-weight: 700;

            text-align: right;

            text-decoration: none;

        }

        .submit {

            width: 100%;

            min-height: 48px;

            border: 0;

            border-radius: 10px;

            background: var(--navy);

            color: var(--white);

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

        }

        .submit:hover {

            background: var(--navy-light);

        }

        .submit:disabled {

            opacity: .65;

            cursor: not-allowed;

        }

        .register {

            margin-top: 20px;

            color: var(--muted);

            font-size: 13px;

            text-align: center;

        }

        .register a {

            color: var(--navy);

            font-weight: 700;

            text-decoration: none;

        }

        .footer {

            margin-top: 18px;

            color: #98A2B3;

            font-size: 11px;

            text-align: center;

        }

        .hidden {

            display: none !important;

        }

        @media (max-width: 420px) {

            body {

                padding: 16px;

            }

            .card {

                padding: 22px 18px;

            }

            .brand-name {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <main class="app">


        <header class="brand">

            <div class="brand-name">

                REMADEF

            </div>


            <div class="brand-line"></div>


            <p class="brand-description">

                Your account. Your identity.
                Your opportunities.

            </p>

        </header>


        <section class="card">


            <h1>

                Welcome back

            </h1>


            <p class="subtitle">

                Sign in to continue to your REMADEF ecosystem.

            </p>


            <div
                id="error"
                class="message error"
                role="alert"
                aria-live="polite"
            ></div>


            <div
                id="success"
                class="message success"
                role="status"
                aria-live="polite"
            ></div>


            <form
                id="login-form"
                novalidate
            >


                <div class="tabs">


                    <button
                        id="email-tab"
                        class="tab active"
                        type="button"
                    >

                        Email

                    </button>


                    <button
                        id="phone-tab"
                        class="tab"
                        type="button"
                    >

                        Phone

                    </button>


                </div>


                <div
                    id="email-box"
                    class="field"
                >


                    <label for="email">

                        Email address

                    </label>


                    <input
                        id="email"
                        type="email"
                        inputmode="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                    >


                </div>


                <div
                    id="phone-box"
                    class="field hidden"
                >


                    <label for="phone">

                        Nigerian phone number

                    </label>


                    <input
                        id="phone"
                        type="tel"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="8037537614"
                    >


                </div>


                <div class="field">


                    <label for="password">

                        Password

                    </label>


                    <div class="password-wrapper">


                        <input
                            id="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                        >


                        <button
                            class="toggle-password"
                            type="button"
                            data-target="password"
                            aria-label="Show password"
                        >

                            👁

                        </button>


                    </div>


                </div>


                <a
                    href="forgot-password.html"
                    class="forgot"
                >

                    Forgot password?

                </a>


                <button
                    id="submit"
                    class="submit"
                    type="submit"
                >

                    Sign In

                </button>


            </form>


            <div class="register">

                Don't have a REMADEF account?


                <a href="index.html">

                    Create account

                </a>

            </div>


        </section>


        <footer class="footer">

            REMADEF — Connecting people to opportunity.

        </footer>


    </main>


    <script
        src="login.js"
        defer
    ></script>


</body>

</html>
