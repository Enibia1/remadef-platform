<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remadef - Identity & Compliance Verification</title>
    <link rel="stylesheet" href="../static/css/global.css">
</head>
<body>
    <main class="main">
        <section class="welcome">
            <div class="welcome-content">
                <h1>Identity & Compliance Verification</h1>
                <p>Verify your credentials to unlock higher transaction velocity limits and partner-secured financial services.</p>
            </div>
        </section>

        <!-- KYC Submission Card -->
        <section style="max-width: 600px; margin: 0 auto; width: 100%;">
            <div class="card-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h3 style="margin: 0;">Tier Upgrade Verification</h3>
                    <span id="kycStatusBadge" style="background: #f59e0b15; color: #f59e0b; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;">Tier 1 (Unverified)</span>
                </div>

                <form onsubmit="submitKycVerification(event)" style="display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <label style="display:block; margin-bottom:6px; font-weight:500; font-size: 14px;">Full Legal Name (As on ID / BVN)</label>
                        <input type="text" id="kycFullName" placeholder="Onyekachi Kizito Chetachi" style="width:100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px;" required>
                    </div>

                    <div>
                        <label style="display:block; margin-bottom:6px; font-weight:500; font-size: 14px;">Verification ID Type</label>
                        <select id="kycIdType" style="width:100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; background: white;">
                            <option value="bvn">Bank Verification Number (BVN)</option>
                            <option value="nin">National Identification Number (NIN)</option>
                        </select>
                    </div>

                    <div>
                        <label style="display:block; margin-bottom:6px; font-weight:500; font-size: 14px;">11-Digit ID Number</label>
                        <input type="text" id="kycIdNumber" maxlength="11" placeholder="22334455667" style="width:100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: monospace;" required>
                    </div>

                    <button type="submit" class="action-btn primary-btn" style="padding: 14px; width:100%; font-size: 15px;">
                        Submit Compliance Verification
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="../static/js/app.js"></script>
    <script>
        async function submitKycVerification(event) {
            event.preventDefault();
            const fullName = document.getElementById("kycFullName").value;
            const idType = document.getElementById("kycIdType").value;
            const idNumber = document.getElementById("kycIdNumber").value;

            if (idNumber.length !== 11) {
                notifyUser("Please enter a valid 11-digit identification number.", true);
                return;
            }

            try {
                const res = await apiRequest('/api/user/kyc/submit', 'POST', {
                    full_name: fullName,
                    id_type: idType,
                    id_number: idNumber
                });
                
                notifyUser("Compliance details submitted successfully! Account upgraded to Tier 2.");
                location.reload();
            } catch (e) {
                notifyUser(`Verification failed: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
