<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remadef - Transaction Audit Ledger</title>
    <link rel="stylesheet" href="../static/css/global.css">
</head>
<body>
    <main class="main">
        <section class="welcome">
            <div class="welcome-content">
                <h1>Transaction Audit Trail</h1>
                <p>Review immutable historical records of all deposits, redemptions, and escrow settlements.</p>
            </div>
        </section>

        <!-- Transactions Table Card -->
        <section class="card-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0;">Historical Activity Log</h3>
                <button onclick="loadTransactions()" class="action-btn" style="background: #f1f5f9; color: var(--text-secondary); border: 1px solid var(--border-color); padding: 6px 12px; font-size: 13px;">Refresh Log</button>
            </div>
            
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary);">
                            <th style="padding: 12px;">Reference ID</th>
                            <th style="padding: 12px;">Transaction Type</th>
                            <th style="padding: 12px;">Amount</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTableBody">
                        <tr><td colspan="5" style="padding: 20px; text-align: center; color: var(--text-secondary);">Loading transaction audit trail...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="../static/js/app.js"></script>
    <script>
        async function loadTransactions() {
            const tbody = document.getElementById('transactionTableBody');
            try {
                const data = await apiRequest('/api/wallet/transactions');
                const rows = data.rows || [];

                if (rows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: var(--text-secondary);">No historical records found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(txn => {
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid var(--border-color)';
                    
                    const statusColor = txn.status === 'SUCCESS' ? 'var(--success)' : 'var(--warning)';
                    
                    tr.innerHTML = `
                        <td style="padding: 12px; font-family: monospace; font-weight: 600;">${txn.reference}</td>
                        <td style="padding: 12px;">${txn.type}</td>
                        <td style="padding: 12px; font-weight: 600;">${formatCurrency(txn.amount)}</td>
                        <td style="padding: 12px;"><span style="color: ${statusColor}; font-weight: 500;">${txn.status}</span></td>
                        <td style="padding: 12px; color: var(--text-secondary); font-size: 13px;">${new Date(txn.created_at).toLocaleString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #ef4444;">Failed to load transaction audit history.</td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadTransactions);
    </script>
</body>
</html>
